name: Проверка Lore Studio
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: lore
          POSTGRES_PASSWORD: lore_local
          POSTGRES_DB: lore_studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lore -d lore_studio_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://lore:lore_local@127.0.0.1:5432/lore_studio_test
      TEST_BASE_URL: http://127.0.0.1:3001
      SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Запуск тестового сервера
        run: |
          npm run start -- --port 3001 > /tmp/lore-studio-server.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:3001/api/health
      - run: npm run test:integration
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
